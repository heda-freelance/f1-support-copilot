services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local embedding and reranker run on the host via llama.cpp
  # for native arm64 performance (TEI's ghcr image is amd64-only).
  # See README "Local model stack" section for the three llama-server
  # invocations and required GGUF model downloads.

volumes:
  pgdata:
