services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "BAAI/bge-base-en-v1.5", "--port", "80"]
    ports:
      - "8081:80"
    volumes:
      - tei-models:/data
    environment:
      HF_HUB_CACHE: /data
    profiles: ["local"]

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "BAAI/bge-reranker-base", "--port", "80"]
    ports:
      - "8082:80"
    volumes:
      - tei-models:/data
    environment:
      HF_HUB_CACHE: /data
    profiles: ["local"]

volumes:
  pgdata:
  tei-models:
