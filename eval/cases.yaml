# 30 evaluation cases for the support copilot.
# Topics: account-settings (4), billing-faq (4), sso-setup (4),
# api-rate-limits (4), data-export (3), team-roles (4),
# integrations-slack (4), troubleshooting (3) — total 25 grounded cases
# plus 3 must-escalate (out-of-docs) and 2 negative-control gibberish.

